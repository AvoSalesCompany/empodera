name: Deploy site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar arquivos do site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d assets ]; then cp -r assets _site/assets; fi
          # evita processamento Jekyll
          touch _site/.nojekyll

      - name: Configurar Pages (habilita se preciso)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
